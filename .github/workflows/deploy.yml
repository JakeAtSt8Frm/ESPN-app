# Refreshes every league's snapshot and deploys the site.
#
# The snapshot step is the only place the ESPN credentials exist. They come from
# repository secrets, are used by a Node script, and never reach the bundle —
# `public/data/<league>` is plain league JSON with no cookie in it.
#
# One cookie pair covers every league in `src/lib/leagues.ts`: they are leagues
# the same ESPN account belongs to, and ESPN authorises the account rather than
# the league. A league on a different account would need its own secrets.
#
# The cron asks for far more runs than the data needs, and that is the point.
#
# GitHub runs scheduled workflows on a best-effort queue. On this repository it
# sheds roughly half of what is asked for and delivers the rest one to four hours
# late: measured across a week, the single daily request for 12:23 landed at
# 16:42, 16:44 and 16:46 on three consecutive days, and a Sunday asking for eight
# runs got four. Moving off ':00' — where every cron anybody writes lands — took
# the shedding down but did not end it, and nothing in a workflow file can,
# because the lateness is in the scheduler and not here.
#
# What a workflow file can do is ask often enough that shedding stops leaving
# holes. One request a day with half of them dropped is a published snapshot
# routinely seven hours old, which is what the app was reporting. Hourly through
# the waking day with half of them dropped is one rarely more than two hours old.
#
# The wasted runs cost nothing. The repository is public, so Actions minutes are
# free, and a run that pulls ESPN only to rewrite an identical file takes about a
# minute — which is the right trade against the app being a slate out of date.
#
# 12:23-04:23 UTC is 7am to 11pm Eastern: waivers, the injury reports, every
# kickoff in the week and the whole Sunday slate. The hours it leaves out are the
# ones where ESPN's numbers genuinely do not move.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # The American day, hourly.
    - cron: '23 12-23 * * *'
    # ...and on through the night games, which run past midnight UTC.
    - cron: '23 0-4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A cron firing while a push is deploying should wait
# rather than race, but a queued cron run is not worth keeping — the next one
# fetches fresher data anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Resolved once, and checked. A bare `$(npm run --silent leagues)` that
      # failed would expand to nothing, every loop below would run zero times,
      # and the deploy would publish a stale snapshot while reporting success.
      - name: Resolve the configured leagues
        id: leagues
        run: |
          keys="$(npm run --silent leagues)"
          if [[ -z "${keys// }" ]]; then
            echo "::error::No leagues configured — check src/lib/leagues.ts"
            exit 1
          fi
          echo "keys=$keys" >> "$GITHUB_OUTPUT"
          echo "pulling: $keys"

      # A first deploy is allowed before the repository secrets are configured:
      # it serves the committed snapshot and makes the page available. Once both
      # cookies exist, every push, scheduled run and manual run pulls ESPN first.
      - name: Check ESPN credentials
        id: espn
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: |
          if [[ -n "$ESPN_SWID" && -n "$ESPN_S2" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploying the committed snapshot. Add ESPN_SWID and ESPN_S2 repository secrets to enable live pulls."
          fi

      # Pulls every configured league, one after another. League ids live in
      # `src/lib/leagues.ts` rather than in a repository variable, so adding a
      # league is a code change that ships with the switcher entry for it.
      - name: Refresh every league's snapshot from ESPN
        if: steps.espn.outputs.configured == 'true'
        env:
          ESPN_SEASON: ${{ vars.ESPN_SEASON }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: npm run snapshot

      # Every file in the snapshot carries its timestamp, and the client refuses
      # to use a fitted model whose stamp disagrees with the index — which is
      # what stops a stale model shipping beside fresh data.
      #
      # A refreshed snapshot therefore leaves the committed models looking stale
      # even though nothing they read has moved: they are fitted on the league's
      # scoring table, each player's position and three finished seasons, none
      # of which change because Sunday's scores came in. Each fit records a hash
      # of those inputs, so `restamp` carries them forward when the hash still
      # matches and exits non-zero when it does not.
      #
      # Refitting is the fallback rather than the default because it is not
      # free: `fit:projection` grows twenty thousand trees over three seasons
      # and takes about two minutes to reproduce, in the ordinary case, a
      # byte-identical file. It runs when a season boundary or a settings change
      # means it has to.
      # Per league: each has its own scoring table, so each has its own fitted
      # models, its own inputs hash and its own restamp decision.
      - name: Carry the fitted models onto the new snapshot, or refit
        if: steps.espn.outputs.configured == 'true'
        run: |
          for league in ${{ steps.leagues.outputs.keys }}; do
            echo "::group::$league"
            ESPN_LEAGUE=$league npm run restamp \
              || (ESPN_LEAGUE=$league npm run fit:priors && ESPN_LEAGUE=$league npm run fit:projection)
            echo "::endgroup::"
          done

      # The scoring engine is checked against ESPN's own applied totals on every
      # deploy, over the snapshot that is about to ship. A stat id ESPN renumbers
      # between seasons would fail here rather than quietly score zero in
      # somebody's lineup.
      #
      # `verify` also cross-checks the finished-season history against the one
      # season reachable through a second, independent endpoint — see
      # verify-history.ts for why that is not optional.
      - name: Verify scoring against ESPN's own totals
        if: steps.espn.outputs.configured == 'true'
        run: |
          for league in ${{ steps.leagues.outputs.keys }}; do
            echo "::group::$league"
            ESPN_LEAGUE=$league npm run verify
            ESPN_LEAGUE=$league npm run report:forecast
            echo "::endgroup::"
          done

      # These read no snapshot — they check the library functions against
      # generated cases — so they run once rather than per league.
      - name: Verify the models
        if: steps.espn.outputs.configured == 'true'
        run: |
          npm run verify:forecast
          npm run verify:lineup
          npm run verify:lineup-alerts
          npm run verify:predictions
          npm run verify:power
          npm run verify:season

      # Value normalization must also hold when publishing committed snapshots
      # without ESPN credentials. This exercises both leagues through the loader.
      - name: Verify player values across positions
        run: |
          npm run verify:trade
          npm run verify:values

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
